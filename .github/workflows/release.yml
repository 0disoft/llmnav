name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run release:check
      - name: Verify release tag
        if: github.ref_type == 'tag'
        run: npm run release:tag
      - name: Check npm registry state
        id: registry
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          package_spec="${package_name}@${package_version}"
          error_log="$(mktemp)"

          if remote_integrity="$(npm view "${package_spec}" dist.integrity 2>"${error_log}")"; then
            local_integrity="$(npm pack --dry-run --ignore-scripts --json | node -e "let input = ''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => { const parsed = JSON.parse(input); const entry = Array.isArray(parsed) ? parsed[0] : Object.values(parsed)[0]; process.stdout.write(entry.integrity); });")"
            if [[ "${remote_integrity}" != "${local_integrity}" ]]; then
              echo "${package_spec} exists, but its package integrity differs from this tag." >&2
              exit 1
            fi
            echo "published=true" >> "${GITHUB_OUTPUT}"
            echo "${package_spec} is already published with matching integrity."
          elif grep -q "E404" "${error_log}"; then
            echo "published=false" >> "${GITHUB_OUTPUT}"
            echo "${package_spec} is not published yet."
          else
            cat "${error_log}" >&2
            exit 1
          fi
      - name: Publish npm package
        if: steps.registry.outputs.published != 'true'
        run: npm publish --provenance=false --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_tag="${GITHUB_REF_NAME}"
          error_log="$(mktemp)"
          trap 'rm -f "${error_log}"' EXIT

          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" --silent 2>"${error_log}"; then
            echo "GitHub Release ${release_tag} already exists."
          elif grep -q "HTTP 404" "${error_log}"; then
            gh release create "${release_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "llmnav ${release_tag}" \
              --generate-notes
          else
            cat "${error_log}" >&2
            exit 1
          fi
