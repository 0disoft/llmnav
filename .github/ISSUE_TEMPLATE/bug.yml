name: Bug report
description: Report a reproducible parser, formatter, index, search, or CLI defect
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include private repository source. Reduce the problem to a minimal fixture.
  - type: input
    id: version
    attributes:
      label: LLMNav version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and operating system
      placeholder: Node.js 24.4.0, Windows 11
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Parser or formatter
        - Validation
        - Generation or determinism
        - Search or evaluation
        - Agent instructions
        - CLI or packaging
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Minimal fixture and command
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and diagnostics
    validations:
      required: true
